name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds a self-contained single-file Windows x64 exe and attaches it to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file overlay
        shell: pwsh
        run: |
          # FIX: Fallback to a safe numeric version layout if triggered manually via the UI button
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ("${{ github.ref_type }}" -ne "tag") {
              $ver = "0.0.1-manual"
          }
          
          dotnet publish src/POE2Radar.Overlay/POE2Radar.Overlay.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Deterministic=true -p:ContinuousIntegrationBuild=true `
            -o publish
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          # FIX: Prevent blank/branch variables from corrupting the archive zip filename naming matrix
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
              $tag = "manual-build"
          }
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "POE2Radar-$tag-win-x64.zip" -Force

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # FIX: Explicit target marker ensures the manual artifact hooks into a dedicated pipeline bucket
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          files: POE2Radar-*-win-x64.zip
          generate_release_notes: true
